<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Physics - Text Demo (Spatial Grid Enabled)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #f5f5f5;
      font-family: Georgia, serif;
      overflow: hidden;
    }
    
    .wrapper {
      position: relative;
      width: 800px;
      margin: 40px auto;
    }
    
    #world {
      position: relative;
      width: 800px;
      height: 600px;
      background: #ffffff;
      border: 2px solid #333;
    }
    
    .container {
      padding: 40px;
    }
    
    .text {
      font-size: 18px;
      line-height: 1.8;
      color: #333;
      display: inline-block;
    }
    
    .text span {
      display: inline-block;
      margin: 0;
      padding: 0;
    }
    
    .text span.space {
      display: inline-block;
    }
    
    .physics-active .text span {
      position: relative;
    }
    
    .attribution {
      position: absolute;
      bottom: -25px;
      right: 10px;
      font-size: 11px;
      color: #666;
      text-align: right;
    }
    
    .attribution a {
      color: #333;
      text-decoration: none;
    }
    
    .attribution a:hover {
      text-decoration: underline;
    }
    
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="world">
      <div class="container">
        <div class="text">
          Two roads diverged in a yellow wood,<br>
          And sorry I could not travel both<br>
          And be one traveler, long I stood<br>
          And looked down one as far as I could<br>
          To where it bent in the undergrowth;
        </div>
      </div>
    </div>
    <div class="attribution">
      "<a href="https://kai4avaya.github.io/dom-physics/demo-text.html">The Road Not Taken</a>"<br>
      by <a href="https://en.wikipedia.org/wiki/Robert_Frost" target="_blank">Robert Frost</a>
    </div>
  </div>

  <script type="module">
    import { World, Body } from './dist/index.js';
    
    const worldElement = document.getElementById('world');
    const textElement = document.querySelector('.text');
    
    let initialized = false;
    let world = null;
    let bodies = [];
    
    // Enable performance logging
    window.__enablePerfLogging = true;
    
    // Performance logging
    let perfStats = {
      frameCount: 0,
      totalTime: 0,
      minTime: Infinity,
      maxTime: 0,
      collisionChecks: 0,
      collisionResolved: 0,
      samples: []
    };
    
    function logPerformance() {
      const stats = window.__domPhysicsStats;
      if (stats) {
        perfStats.frameCount++;
        perfStats.totalTime += stats.totalTime;
        perfStats.minTime = Math.min(perfStats.minTime, stats.totalTime);
        perfStats.maxTime = Math.max(perfStats.maxTime, stats.totalTime);
        perfStats.collisionChecks += stats.collisionChecks || 0;
        perfStats.collisionResolved += stats.collisionResolved || 0;
        
        // Sample every 60 frames (~1 second)
        if (perfStats.frameCount % 60 === 0) {
          const avgTime = perfStats.totalTime / perfStats.frameCount;
          const fps = 1000 / avgTime;
          
          perfStats.samples.push({
            frame: perfStats.frameCount,
            avgTime: avgTime.toFixed(2),
            minTime: perfStats.minTime.toFixed(2),
            maxTime: perfStats.maxTime.toFixed(2),
            fps: fps.toFixed(1),
            collisionChecks: stats.collisionChecks,
            collisionResolved: stats.collisionResolved,
            bodyCount: stats.bodyCount,
            spatialGridEnabled: stats.spatialGridEnabled
          });
          
          console.log(`[Performance - SPATIAL GRID ENABLED] Frame ${perfStats.frameCount}: ` +
            `avg=${avgTime.toFixed(2)}ms (${fps.toFixed(1)}fps), ` +
            `min=${perfStats.minTime.toFixed(2)}ms, max=${perfStats.maxTime.toFixed(2)}ms, ` +
            `checks=${stats.collisionChecks}, resolved=${stats.collisionResolved}, ` +
            `bodies=${stats.bodyCount}, grid=${stats.spatialGridEnabled ? 'ON' : 'OFF'}`);
        }
      }
    }
    
    // Log performance every frame
    const perfInterval = setInterval(logPerformance, 16);
    
    // Log summary on page unload
    window.addEventListener('beforeunload', () => {
      clearInterval(perfInterval);
      if (perfStats.frameCount > 0) {
        const avgTime = perfStats.totalTime / perfStats.frameCount;
        const avgFps = 1000 / avgTime;
        console.log(`\n[Performance Summary - SPATIAL GRID ENABLED]`);
        console.log(`Total frames: ${perfStats.frameCount}`);
        console.log(`Average frame time: ${avgTime.toFixed(2)}ms (${avgFps.toFixed(1)}fps)`);
        console.log(`Min frame time: ${perfStats.minTime.toFixed(2)}ms`);
        console.log(`Max frame time: ${perfStats.maxTime.toFixed(2)}ms`);
        console.log(`Total collision checks: ${perfStats.collisionChecks}`);
        console.log(`Total collisions resolved: ${perfStats.collisionResolved}`);
        console.log(`Performance samples:`, perfStats.samples);
      }
    });
    
    function initializePhysics() {
      if (initialized) return;
      initialized = true;
      
      const text = textElement.innerHTML;
      let wrapped = '';

      const computedStyle = getComputedStyle(textElement);
      const fontSize = parseFloat(computedStyle.fontSize);
      
      const tempLine = document.createElement('div');
      tempLine.style.lineHeight = computedStyle.lineHeight;
      tempLine.style.fontSize = computedStyle.fontSize;
      tempLine.style.position = 'absolute';
      tempLine.style.visibility = 'hidden';
      tempLine.innerHTML = 'A';
      document.body.appendChild(tempLine);
      const spaceHeight = tempLine.getBoundingClientRect().height;
      document.body.removeChild(tempLine);

      const tempSpan = document.createElement('span');
      tempSpan.style.fontSize = getComputedStyle(textElement).fontSize;
      tempSpan.innerHTML = ' ';
      textElement.appendChild(tempSpan);
      const spaceWidth = tempSpan.getBoundingClientRect().width; 
      textElement.removeChild(tempSpan);

      let i = 0;
      
      while (i < text.length) {
        const char = text[i];
        
        if (char === '<') {
          let tag = '';
          while (i < text.length && text[i] !== '>') {
            tag += text[i];
            i++;
          }
          if (i < text.length) {
            tag += text[i];
            i++;
          }
          wrapped += tag;
        } else if (char === ' ') {
          wrapped += `<span class="space" style="width: ${spaceWidth}px; height: ${spaceHeight}px;"> </span>`;
          i++;
        } else if (char === '\n') {
          i++;
        } else {
          wrapped += `<span>${char}</span>`;
          i++;
        }
      }
      
      textElement.innerHTML = wrapped;
      
      // SPATIAL GRID ENABLED - for comparison
      // Using smaller cell size (25px) for text demos - letters are clustered together
      world = new World(worldElement, {
        gravity: 400,
        friction: 0.97,
        restitution: 0.5,
        spatialGrid: true, // ENABLED - compare with demo-text.html
        spatialGridCellSize: 25 // Smaller cells for better separation of clustered letters
      });
      
      const spans = textElement.querySelectorAll('span');

      spans.forEach((span) => {
        const isSpace = span.classList.contains('space');
        
        const body = new Body(span, world, {
          mass: 1,
          radius: 8,
          restitution: 0.6,
          isStatic: isSpace
        });

        world.registerBody(body);
        
        if (!isSpace) {
          bodies.push(body);
        }
      });
      
      worldElement.classList.add('physics-active');
      world.start();
      
      console.log('World initialized with spatial grid ENABLED');
      console.log('Total bodies:', world.bodies.length);
      console.log('Dynamic bodies:', bodies.length);
    }
      
    textElement.addEventListener('mousemove', (e) => {
      if (!initialized) {
        initializePhysics();
      }
      
      const rect = worldElement.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      
      bodies.forEach(body => {
        const pos = body.getWorldPosition();
        const dx = pos.x - mx;
        const dy = pos.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < 80 && dist > 0) {
          const force = (80 - dist) * 80;
          body.applyForce(
            (dx / dist) * force,
            (dy / dist) * force
          );
        }
      });
    });
    
    // Cleanup
    window.addEventListener('beforeunload', () => {
      clearInterval(perfInterval);
      if (world) {
        world.stop();
      }
    });
  </script>
</body>
</html>
